const svg = d3.select("#fwSvg");
const margin = { top: 40, right: 320, bottom: 40, left: 260 };
const width = 1600;
const height = 1000;

svg.attr("width", width).attr("height", height);
const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

const tree = d3.tree().size([height - margin.top - margin.bottom, width - margin.left - margin.right - 200]);

let root = d3.hierarchy(TREE_DATA);
let i = 0;
const duration = 300;

root.x0 = (height - margin.top - margin.bottom) / 2;
root.y0 = 0;

root.children.forEach(collapse);
update(root);

function collapse(d) {
  if (d.children) {
    d._children = d.children;
    d._children.forEach(collapse);
    d.children = null;
  }
}

function update(source) {
  const treeData = tree(root);
  const nodes = treeData.descendants();
  const links = treeData.links();

  nodes.forEach(d => { d.y = d.depth * 260; });

  // ─── LINKS ───
  const link = g.selectAll("path.link").data(links, d => d.target.id);

  const linkEnter = link.enter().insert("path", "g")
    .attr("class", "link")
    .attr("fill", "none")
    .attr("stroke", "#8ba3c8")
    .attr("stroke-width", 2)
    .attr("stroke-linecap", "round")
    .attr("stroke-opacity", 1)
    .attr("d", d => {
      const o = { x: source.x0, y: source.y0 };
      return diagonal({ source: o, target: o });
    });

  linkEnter.merge(link)
    .attr("fill", "none")
    .attr("stroke", "#8ba3c8")
    .attr("stroke-width", 2)
    .attr("stroke-linecap", "round")
    .attr("stroke-opacity", 1)
    .transition().duration(duration)
    .attr("d", diagonal);

  link.exit().transition().duration(duration)
    .attr("d", d => {
      const o = { x: source.x, y: source.y };
      return diagonal({ source: o, target: o });
    })
    .remove();

  // ─── NODES ───
  const node = g.selectAll("g.node").data(nodes, d => d.id || (d.id = ++i));

  const nodeEnter = node.enter().append("g")
    .attr("class", "node")
    .attr("transform", d => `translate(${source.y0},${source.x0})`)
    .on("click", (event, d) => {
      if (d.data.url) {
        window.open(d.data.url, "_blank");
        return;
      }
      if (d.children) {
        d._children = d.children;
        d.children = null;
      } else {
        d.children = d._children;
        d._children = null;
      }
      update(d);
    });

  nodeEnter.append("circle")
    .attr("r", 1e-6)
    .attr("fill", d => d.data.url ? "#0a0b0e" : (d._children ? "#ff3b3b" : "#0a0b0e"))
    .attr("stroke", d => d.data.url ? "#4a5260" : "#c8d4e0")
    .attr("stroke-width", d => d.data.url ? 1 : 2);

  nodeEnter.append("text")
    .attr("dy", ".35em")
    .attr("x", d => d.children || d._children ? -14 : 14)
    .attr("text-anchor", d => d.children || d._children ? "end" : "start")
    .text(d => d.data.name)
    .style("fill", d => d.data.url ? "#8892a0" : "#fff")
    .style("font-size", d => d.data.url ? "12px" : "13px")
    .style("font-weight", d => d.data.url ? "500" : "700")
    .style("font-family", "Inter, sans-serif")
    .style("cursor", "pointer");

  const nodeUpdate = node.merge(nodeEnter);

  nodeUpdate.transition().duration(duration)
    .attr("transform", d => `translate(${d.y},${d.x})`);

  nodeUpdate.select("circle")
    .attr("r", 6)
    .attr("fill", d => d.data.url ? "#0a0b0e" : (d._children ? "#ff3b3b" : "#0a0b0e"))
    .attr("stroke", d => d.data.url ? "#4a5260" : "#c8d4e0")
    .attr("stroke-width", d => d.data.url ? 1 : 2);

  nodeUpdate.select("text")
    .style("fill", d => d.data.url ? "#8892a0" : "#fff")
    .style("font-weight", d => d.data.url ? "500" : "700");

  const nodeExit = node.exit().transition().duration(duration)
    .attr("transform", d => `translate(${source.y},${source.x})`)
    .remove();

  nodeExit.select("circle").attr("r", 1e-6);
  nodeExit.select("text").style("fill-opacity", 1e-6);

  nodes.forEach(d => { d.x0 = d.x; d.y0 = d.y; });
}

function diagonal(d) {
  return `M${d.source.y},${d.source.x}C${(d.source.y + d.target.y) / 2},${d.source.x} ${(d.source.y + d.target.y) / 2},${d.target.x} ${d.target.y},${d.target.x}`;
}

function filterTree() {
  const q = document.getElementById('fwSearch').value.toLowerCase().trim();
  if (!q) {
    root = d3.hierarchy(TREE_DATA);
    root.x0 = (height - margin.top - margin.bottom) / 2;
    root.y0 = 0;
    i = 0;
    root.children.forEach(collapse);
    g.selectAll("*").remove();
    update(root);
    return;
  }
  function expandAll(d) {
    if (d._children) { d.children = d._children; d._children = null; }
    if (d.children) d.children.forEach(expandAll);
  }
  expandAll(root);
  g.selectAll("*").remove();
  i = 0;
  update(root);
}
