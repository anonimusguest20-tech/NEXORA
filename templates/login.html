<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8"><title>Login</title><link rel="stylesheet" href="/static/style.css"></head>
<body class="auth">
<form method="POST" class="auth-form">
  <div class="brand-icon big">N</div>
  <h2>Accedi a NEXORA</h2>
  {% with m = get_flashed_messages() %}{% if m %}<p style="color:#ff3b3b">{{ m[0] }}</p>{% endif %}{% endwith %}
  <input name="email" type="email" placeholder="Email" required>
  <input name="password" type="password" placeholder="Password" required>
  <button type="submit">Accedi</button>
  <p>Non hai un account? <a href="/register">Registrati</a></p>
</form>
</body></html>
