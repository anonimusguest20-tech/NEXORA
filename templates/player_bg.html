<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><title>NEXORA Player</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #050608;
    color: #fff;
    font-family: 'Inter', sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .header {
    padding: 12px 16px;
    border-bottom: 1px solid #14161c;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .n {
    width: 28px; height: 28px;
    background: linear-gradient(135deg, #fff, #8892a0);
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #000;
    font-weight: 900;
    font-size: 14px;
  }
  .brand {
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 2px;
  }
  .sub {
    font-size: 9px;
    color: #555;
    letter-spacing: 1.5px;
  }
  .player-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
  }
  #ytPlayer {
    width: 100%;
    height: 100%;
    border-radius: 8px;
    overflow: hidden;
  }
  .now {
    padding: 10px 16px;
    border-top: 1px solid #14161c;
    font-size: 12px;
    color: #aaa;
    text-overflow: ellipsis;
    white-space: nowrap;
    overflow: hidden;
  }
  .now b { color: #fff; }
</style>
</head>
<body>

<div class="header">
  <div class="n">N</div>
  <div>
    <div class="brand">NEXORA</div>
    <div class="sub">MUSIC PLAYER</div>
  </div>
</div>

<div class="player-wrap">
  <div id="ytPlayer"></div>
</div>

<div class="now" id="now">Caricamento playlist...</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
const PLAYLIST_ID = "PLcL3BVYhxFZA";
let player;

function onYouTubeIframeAPIReady(){
  player = new YT.Player('ytPlayer', {
    height: '100%',
    width: '100%',
    playerVars: {
      listType: 'playlist',
      list: PLAYLIST_ID,
      autoplay: 1,
      controls: 1,
      modestbranding: 1,
      rel: 0,
      iv_load_policy: 3,
      playsinline: 1
    },
    events: {
      'onStateChange': onStateChange,
      'onError': onError
    }
  });
}

function onStateChange(e){
  if (e.data === YT.PlayerState.PLAYING){
    const data = player.getVideoData();
    document.getElementById('now').innerHTML = '<b>' + (data.title || 'In riproduzione') + '</b> — ' + (data.author || '');
  } else if (e.data === YT.PlayerState.ENDED){
    player.playVideoAt(0);
  }
}

function onError(e){
  const next = (player.getPlaylistIndex() + 1) % player.getPlaylist().length;
  player.playVideoAt(next);
}
</script>
</body>
</html>
