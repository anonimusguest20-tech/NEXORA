<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8"><title>Register — NEXORA</title>
<link rel="stylesheet" href="/static/style.css"></head>
<body class="auth">
<form method="POST" class="auth-form">
  <div class="brand-icon big">N</div>
  <h2>Crea il tuo account</h2>
  {% with m = get_flashed_messages() %}{% if m %}<p style="color:#ff3b3b">{{ m[0] }}</p>{% endif %}{% endwith %}
  <input name="email" type="email" placeholder="Email" required autofocus>
  <input name="username" type="text" placeholder="Username (3-20 caratteri)" minlength="3" maxlength="20" required>
  <input name="password" type="password" placeholder="Password" minlength="6" required>
  <button type="submit">Registrati</button>
  <p>Hai già un account? <a href="/login">Accedi</a></p>
</form>
</body></html>
