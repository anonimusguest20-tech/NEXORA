<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><title>Registrati — NEXORA</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#050608;
  color:#fff;
  font-family:'Inter',sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background-image:
    radial-gradient(circle at 50% 40%, rgba(200,220,255,0.04), transparent 50%),
    repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0 1px, transparent 1px 40px),
    repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0 1px, transparent 1px 40px);
}
.card {
  background:#0a0b0e;
  border:1px solid #1a1d24;
  border-radius:24px;
  padding:48px 40px 40px;
  max-width:440px;
  width:100%;
  text-align:center;
}
.logo-circle {
  width:64px;
  height:64px;
  border-radius:50%;
  background:rgba(20,22,28,0.9);
  border:1px solid #1f242c;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 24px;
}
.logo-circle svg { width:28px; height:28px; stroke:#8892a0; }
h1 { font-size:26px; font-weight:800; margin-bottom:8px; }
.sub { color:#888; font-size:14px; margin-bottom:32px; }
.label { display:block; text-align:left; font-size:12px; font-weight:600; color:#ccc; margin-bottom:8px; }
input {
  width:100%;
  background:#14161c;
  border:1px solid #1f242c;
  color:#fff;
  padding:14px 16px;
  border-radius:10px;
  font-size:14px;
  font-family:inherit;
  outline:none;
  margin-bottom:20px;
  transition:border-color 0.2s;
}
input:focus { border-color:#5865f2; }
.btn {
  width:100%;
  background:#5865f2;
  color:#fff;
  border:none;
  padding:14px;
  border-radius:999px;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
  font-family:inherit;
}
.btn:hover { background:#4752c4; }
.divider {
  display:flex;
  align-items:center;
  gap:14px;
  color:#666;
  font-size:12px;
  margin:24px 0;
}
.divider::before, .divider::after {
  content:'';
  flex:1;
  height:1px;
  background:#1f242c;
}
.bottom { color:#888; font-size:13px; }
.bottom a { color:#5865f2; text-decoration:none; font-weight:600; }
.bottom a:hover { text-decoration:underline; }
.error {
  background:rgba(255,60,60,0.08);
  border:1px solid rgba(255,60,60,0.3);
  color:#ff8080;
  padding:12px 14px;
  border-radius:10px;
  font-size:13px;
  margin-bottom:20px;
  text-align:left;
}
</style>
</head>
<body>
<div class="card">
  <div class="logo-circle">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
      <circle cx="11" cy="11" r="7"/>
      <path d="M21 21l-4-4"/>
    </svg>
  </div>
  <h1>Create an account</h1>
  <p class="sub">Registrati in 5 secondi</p>

  {% with msgs = get_flashed_messages() %}{% if msgs %}<div class="error">{{ msgs[0] }}</div>{% endif %}{% endwith %}

  <form method="POST">
    <label class="label">Email</label>
    <input name="email" type="email" placeholder="nome@esempio.com" required autofocus>

    <label class="label">Username</label>
    <input name="username" type="text" placeholder="il_tuo_username" minlength="3" maxlength="20" required>

    <label class="label">Password</label>
    <input name="password" type="password" placeholder="Minimo 6 caratteri" minlength="6" required>

    <button type="submit" class="btn">Create account →</button>
  </form>

  <p class="bottom" style="margin-top:24px;">Hai già un account? <a href="/login">Sign in</a></p>
</div>
</body>
</html>
