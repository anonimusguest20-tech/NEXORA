<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8"><title>Register — NEXORA</title>
<link rel="stylesheet" href="/static/style.css"></head>
<body class="auth">
<form method="POST" class="auth-form">
  <div class="brand-icon big">N</div>
  <h2>Crea il tuo account</h2>
  <p style="color:#888;font-size:13px;margin-bottom:16px">Inserisci la tua email. Ti invieremo un codice di verifica.</p>
  {% with m = get_flashed_messages() %}{% if m %}<p style="color:#ff3b3b">{{ m[0] }}</p>{% endif %}{% endwith %}
  <input name="email" type="email" placeholder="La tua email" required autofocus>
  <button type="submit">Invia codice</button>
  <p>Hai già un account? <a href="/login">Accedi</a></p>
</form>
</body></html>
