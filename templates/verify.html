<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><title>Verifica email — NEXORA</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#050608;
  color:#fff;
  font-family:'Inter',sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background-image:
    radial-gradient(circle at 50% 40%, rgba(200,220,255,0.04), transparent 50%),
    repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0 1px, transparent 1px 40px),
    repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0 1px, transparent 1px 40px);
}
.card {
  background:#0a0b0e;
  border:1px solid #1a1d24;
  border-radius:24px;
  padding:48px 40px 40px;
  max-width:440px;
  width:100%;
  text-align:center;
}
.logo-circle {
  width:64px;
  height:64px;
  border-radius:50%;
  background:rgba(20,22,28,0.9);
  border:1px solid #1f242c;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 24px;
}
.logo-circle svg { width:28px; height:28px; stroke:#8892a0; }
h1 {
  font-size:26px;
  font-weight:800;
  margin-bottom:8px;
  letter-spacing:-0.3px;
}
.sub {
  color:#888;
  font-size:14px;
  margin-bottom:8px;
  line-height:1.5;
}
.email {
  color:#fff;
  font-weight:600;
  font-size:14px;
  margin-bottom:32px;
  word-break:break-all;
}
.code-row {
  display:flex;
  gap:8px;
  justify-content:center;
  margin-bottom:24px;
}
.code-input {
  width:52px;
  height:64px;
  background:#14161c;
  border:1px solid #1f242c;
  color:#fff;
  font-size:28px;
  font-weight:800;
  text-align:center;
  border-radius:12px;
  outline:none;
  font-family:'Inter',sans-serif;
  transition:all 0.2s;
}
.code-input:focus {
  border-color:#5865f2;
  background:#1a1d24;
}
.code-input.filled {
  border-color:#4ade80;
  background:rgba(74,222,128,0.08);
}
.resend {
  color:#888;
  font-size:13px;
  margin-bottom:32px;
}
.resend a {
  color:#5865f2;
  text-decoration:none;
  font-weight:700;
}
.resend a:hover { text-decoration:underline; }
.btn-verify {
  width:100%;
  background:#5865f2;
  color:#fff;
  border:none;
  padding:14px;
  border-radius:999px;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
  font-family:inherit;
  transition:background 0.2s;
}
.btn-verify:hover { background:#4752c4; }
.btn-verify:disabled {
  background:#1f242c;
  color:#666;
  cursor:not-allowed;
}
.divider {
  display:flex;
  align-items:center;
  gap:14px;
  color:#666;
  font-size:12px;
  margin:24px 0;
}
.divider::before, .divider::after {
  content:'';
  flex:1;
  height:1px;
  background:#1f242c;
}
.bottom {
  color:#888;
  font-size:13px;
}
.bottom a { color:#5865f2; text-decoration:none; font-weight:600; }
.error {
  background:rgba(255,60,60,0.08);
  border:1px solid rgba(255,60,60,0.3);
  color:#ff8080;
  padding:12px 14px;
  border-radius:10px;
  font-size:13px;
  margin-bottom:20px;
}
</style>
</head>
<body>
<div class="card">
  <div class="logo-circle">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
      <circle cx="11" cy="11" r="7"/>
      <path d="M21 21l-4-4"/>
    </svg>
  </div>
  <h1>Check your email</h1>
  <p class="sub">Enter the 6-digit code sent to</p>
  <p class="email">{{ email }}</p>

  {% with msgs = get_flashed_messages() %}{% if msgs %}<div class="error">{{ msgs[0] }}</div>{% endif %}{% endwith %}

  <form method="POST" id="verifyForm">
    <input type="hidden" name="code" id="codeHidden">
    <div class="code-row">
      <input class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="0">
      <input class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="1">
      <input class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="2">
      <input class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="3">
      <input class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="4">
      <input class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="5">
    </div>
    <p class="resend">Didn't receive it? <a href="/register">Resend Code</a></p>
    <button type="submit" class="btn-verify" id="verifyBtn" disabled>Verify →</button>
  </form>

  <div class="divider">or continue with</div>

  <p class="bottom">Already have an account? <a href="/login">Sign in</a></p>
</div>

<script>
const inputs = document.querySelectorAll('.code-input');
const hidden = document.getElementById('codeHidden');
const btn = document.getElementById('verifyBtn');

inputs.forEach((inp, i) => {
  inp.addEventListener('input', e => {
    let v = e.target.value.replace(/\D/g, '');
    e.target.value = v;
    if (v) {
      e.target.classList.add('filled');
      if (i < inputs.length - 1) inputs[i+1].focus();
    } else {
      e.target.classList.remove('filled');
    }
    updateHidden();
  });

  inp.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && !e.target.value && i > 0) {
      inputs[i-1].focus();
      inputs[i-1].value = '';
      inputs[i-1].classList.remove('filled');
      updateHidden();
    }
  });

  inp.addEventListener('paste', e => {
    e.preventDefault();
    const paste = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
    for (let j = 0; j < 6 && j < paste.length; j++) {
      inputs[j].value = paste[j];
      inputs[j].classList.add('filled');
    }
    if (paste.length >= 6) inputs[5].focus();
    updateHidden();
  });
});

function updateHidden() {
  const code = Array.from(inputs).map(i => i.value).join('');
  hidden.value = code;
  btn.disabled = code.length !== 6;
}

inputs[0].focus();
</script>
</body>
</html>
